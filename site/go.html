<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening the App Store… – Sharliz Tower</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#230b4f;color:#fff;font:16px system-ui,sans-serif;text-align:center}a{color:#ffd23f}</style>
</head>
<body>
<!-- /go counts App Store taps from the ad page (/play) as page views in Cloudflare Web Analytics, then forwards to the store. /go?ct=<name> keeps the App Store campaign token. -->
<p>Opening the App Store…<br><a id="to" href="https://apps.apple.com/app/apple-store/id6819720504?pt=129570131&amp;ct=meta_w1_caau&amp;mt=8">Tap here if nothing happens</a></p>
<script>
(function(){var a=document.getElementById('to');try{var c=new URLSearchParams(location.search).get('ct');if(c&&/^[\w-]{1,30}$/.test(c))a.href=a.href.replace(/ct=[^&]*/,'ct='+c)}catch(e){}
// short pause so the analytics beacon is sent before we leave
setTimeout(function(){location.replace(a.href)},600)})();
</script>
</body>
</html>
