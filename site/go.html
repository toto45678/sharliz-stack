<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening the App Store… – Sharliz Tower</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#230b4f;color:#fff;font:16px system-ui,sans-serif;text-align:center}a{color:#ffd23f}</style>
</head>
<body>
<!-- /go counts App Store taps from the ad page (/play) as page views in Cloudflare Web Analytics, then forwards to the store. /go?ct=<name> keeps the App Store campaign token, &ppid=<id> opens a Custom Product Page. -->
<p>Opening the App Store…<br><a id="to" href="https://apps.apple.com/app/apple-store/id6819720504?pt=129570131&amp;ct=meta_w1_caau&amp;mt=8">Tap here if nothing happens</a></p>
<script>
(function(){var a=document.getElementById('to');try{var q=new URLSearchParams(location.search),c=q.get('ct'),pp=q.get('ppid');if(c&&/^[\w-]{1,30}$/.test(c))a.href=a.href.replace(/ct=[^&]*/,'ct='+c);
// ?ppid=<id> opens a Custom Product Page (Apple's page id: hex digits and dashes)
if(pp&&/^[0-9a-fA-F-]{8,40}$/.test(pp))a.href+='&ppid='+pp}catch(e){}
// leave only after the page has loaded, so Cloudflare's deferred analytics beacon (injected at the end of body) has sent the view; 2.5 s at most
var gone=false;function go(){if(!gone){gone=true;location.replace(a.href)}}
window.addEventListener('load',function(){setTimeout(go,400)});setTimeout(go,2500)})();
</script>
</body>
</html>
