:root{--deep:#230b4f;--yellow:#ffd23f;--soft:#eadffe}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,#5a24b0 0%,var(--deep) 62%);color:#fff;font:700 15px/1.4 Nunito,system-ui,sans-serif;text-align:center}
.wrap{height:100vh;height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:max(10px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom))}
.clip{position:relative;flex:0 0 auto;height:calc(100vh - 296px);height:calc(100svh - 296px);max-height:560px;min-height:160px;aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:#e9b6e8;box-shadow:0 0 0 3px rgba(255,255,255,.2),0 16px 36px rgba(0,0,0,.45)}
.clip img,.clip video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.clip video{opacity:0;transition:opacity .25s}
.clip video.on{opacity:1}
.side{display:flex;flex-direction:column;align-items:center;gap:12px}
h1{margin:0;font:400 clamp(26px,7.4vw,34px)/1.08 "Titan One",system-ui,sans-serif;letter-spacing:.3px;color:var(--yellow);text-shadow:0 3px 0 rgba(0,0,0,.35)}
h1 span{display:block;color:#fff;font-size:.72em}
.badge{display:block;line-height:0;border-radius:12px}
.badge img{height:62px;width:auto}
.badge:focus-visible,.desk a:focus-visible{outline:3px solid #fff;outline-offset:4px}
.fine{margin:0;color:var(--soft);font-size:13.5px}
.fine a{color:var(--soft)}
.fine span{white-space:nowrap}
.gift{margin:0;max-width:340px;padding:6px 14px;border-radius:16px;background:rgba(255,210,63,.16);border:2px solid rgba(255,210,63,.55);color:#fff;font-size:14px;line-height:1.3}
.gift b{color:var(--yellow)}
.desk{display:none}
/* computers: scan the QR with a phone instead of tapping the badge */
@media (hover:hover) and (pointer:fine) and (min-width:700px){
  .wrap{flex-direction:row;gap:48px}
  .clip{height:calc(100vh - 60px);max-height:640px}
  .side{gap:14px;max-width:340px}
  .tap{display:none}
  .desk{display:flex;flex-direction:column;align-items:center;gap:8px}
  .qr{width:180px;height:180px;padding:6px;background:#fff;border-radius:14px;box-shadow:0 10px 26px rgba(0,0,0,.4)}
  .qr svg{display:block;width:100%;height:100%}
  .desk p{margin:0;color:var(--soft)}
  .desk a{color:var(--yellow);font-size:13.5px}
}
/* phones held sideways */
@media (max-height:520px) and (orientation:landscape){.wrap{flex-direction:row;gap:28px}.clip{height:calc(100vh - 24px);height:calc(100svh - 24px)}}
</style>

<script>
(function(){
// a different campaign can reuse this page: /play?ct=<name> swaps the token on the badge and the link (letters, digits, _ and -, max 30); the QR always carries meta_w1_caau
try{var c=new URLSearchParams(location.search).get('ct');if(c&&/^[\w-]{1,30}$/.test(c))['get','getd'].forEach(function(i){var a=document.getElementById(i);a.href=a.href.replace(/ct=[^&]*/,'ct='+c)})}catch(e){}
// the muted loop starts loading only after the page (and the poster) has loaded, and fades in once it plays; skipped for reduced motion and data saver
function clip(){
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches||(navigator.connection&&navigator.connection.saveData))return}catch(e){}
  var v=document.createElement('video');v.muted=true;v.defaultMuted=true;v.loop=true;v.playsInline=true;v.autoplay=true;v.preload='auto';
  v.setAttribute('muted','');v.setAttribute('playsinline','');v.setAttribute('aria-hidden','true');
  v.addEventListener('playing',function(){v.className='on'},{once:true});
  v.src='img/hold_loop.mp4';document.querySelector('.clip').appendChild(v);
  var p=v.play();if(p&&p.catch)p.catch(function(){});
}
if(document.readyState==='complete')setTimeout(clip,150);else window.addEventListener('load',function(){setTimeout(clip,150)});
})();
