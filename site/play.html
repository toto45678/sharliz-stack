<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sharliz Tower – Will your tower hold?</title>
<meta name="description" content="Stack wobbly jelly Sharliz as high as you can. 300 levels, 30 bosses, your own Sharliz house. Free to play on iPhone and iPad, optional in-app purchases.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Sharliz Tower – Will your tower hold?">
<meta property="og:description" content="Stack wobbly Sharliz, beat 30 bosses, build your house. Free on iPhone and iPad.">
<meta property="og:image" content="https://sharliztower.com/img/og.jpg">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sharliztower.com/play">
<link rel="canonical" href="https://sharliztower.com/">
<meta name="theme-color" content="#230b4f">
<link rel="icon" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preload" as="image" href="img/logo.webp">
<link rel="preload" href="fonts/titanone-latin.woff2" as="font" type="font/woff2" crossorigin>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
/* ad landing page (Meta Traffic ads can't link straight to the App Store): one screen, one button, the button carries the ad's campaign link */
:root{--deep:#230b4f;--purple:#4b1b94;--pink:#ff4fa3;--yellow:#ffd23f;--ink:#fff;--soft:#eadffe}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:radial-gradient(120% 70% at 50% 0%,#5a24b0 0%,var(--deep) 62%);color:var(--ink);font:700 17px/1.45 Nunito,system-ui,sans-serif;text-align:center;overflow-x:hidden}
h1,h2,.store,.chip{font-family:"Titan One",system-ui,sans-serif;font-weight:400;letter-spacing:.4px}
img,video{display:block;max-width:100%}
.wrap{max-width:460px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px max(26px,env(safe-area-inset-bottom))}
.logo{width:min(300px,78%,32svh);height:auto;margin:0 auto;filter:drop-shadow(0 10px 22px rgba(0,0,0,.4))}
h1{font-size:30px;line-height:1.1;margin:8px 0 4px;color:var(--yellow);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.sub{margin:0 0 14px;color:var(--soft);font-size:16px}
.phone{width:clamp(140px,calc((100svh - 400px)*.5625),min(250px,64vw));margin:0 auto 18px;border-radius:30px;padding:8px;background:#0d0820;box-shadow:0 0 0 3px rgba(255,255,255,.18),0 18px 40px rgba(0,0,0,.45)}
.phone video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:23px;background:#1a0b3a}
.store{display:inline-flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:340px;padding:14px 18px;border-radius:18px;background:#000;border:3px solid var(--yellow);color:#fff;text-decoration:none;font-size:24px;line-height:1.1;box-shadow:0 0 0 4px rgba(255,210,63,.25),0 10px 24px rgba(0,0,0,.4);animation:pulse 2.2s ease-in-out infinite}
.store small{display:block;font-family:Nunito;font-weight:800;font-size:13px;opacity:.85;margin-bottom:2px;text-align:left}
.store .si{font-size:30px;line-height:1}
.store:focus-visible{outline:3px solid #fff;outline-offset:4px}
@keyframes pulse{50%{transform:scale(1.035)}}
@media (prefers-reduced-motion:reduce){.store{animation:none}}
.fine{margin:10px 0 18px;font-size:13.5px;color:var(--soft);opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 18px}
.chip{background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 14px;font-size:15px}
.more{font-size:14px;color:var(--soft)}
.more a{color:var(--yellow)}
</style>
</head>
<body>
<main class="wrap">
  <img class="logo" src="img/logo.webp" alt="Sharliz Tower" width="900" height="564" fetchpriority="high">
  <h1>Will your tower hold?</h1>
  <p class="sub">Drop the wobbly jelly Sharliz and stack them sky high.</p>
  <div class="phone"><video src="img/clip.mp4" poster="img/clip_poster.webp" autoplay muted loop playsinline aria-label="Sharliz Tower gameplay"></video></div>
  <a class="store" id="get" href="https://apps.apple.com/app/apple-store/id6819720504?pt=129570131&amp;ct=meta_w1_caau&amp;mt=8" rel="noopener">
    <span class="si" aria-hidden="true">📱</span><span><small>Download free on the</small>App Store</span></a>
  <p class="fine">Free to play · optional in-app purchases · no loot boxes<br>iPhone and iPad</p>
  <div class="chips"><span class="chip">300 levels</span><span class="chip">30 bosses</span><span class="chip">Your own house</span><span class="chip">19 buddies</span></div>
  <p class="more"><a href="/">More about the game</a> · <a href="privacy.html">Privacy</a></p>
</main>
<script>
// a different campaign can reuse this page: /play?ct=<name> swaps the App Store campaign token (letters, digits, _ and -, max 30)
(function(){try{var c=new URLSearchParams(location.search).get('ct');if(c&&/^[\w-]{1,30}$/.test(c)){var a=document.getElementById('get');a.href=a.href.replace(/ct=[^&]*/,'ct='+c)}}catch(e){}})();
</script>
</body>
</html>
