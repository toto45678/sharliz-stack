<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening the App Store… – Sharliz Tower</title>
<!-- /go-rt = /go for the retargeting ad (default token meta_rt). ?ct=<name> replaces the App Store campaign token, &ppid=<id> opens a Custom Product Page.
     It forwards at once (no wait for the page to load), so Cloudflare Web Analytics only counts the views where its beacon loaded first: read the App Store campaign numbers (ct) for taps. -->
<script>
(function(){var u='https://apps.apple.com/app/apple-store/id6819720504?pt=129570131&ct=meta_rt&mt=8';try{var q=new URLSearchParams(location.search),c=q.get('ct'),pp=q.get('ppid');if(c&&/^[\w-]{1,30}$/.test(c))u=u.replace(/ct=[^&]*/,'ct='+c);
// ppid = Apple's Custom Product Page id: hex digits and dashes
if(pp&&/^[0-9a-fA-F-]{8,40}$/.test(pp))u+='&ppid='+pp}catch(e){}
window.__to=u;location.replace(u)})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://apps.apple.com/app/apple-store/id6819720504?pt=129570131&amp;ct=meta_rt&amp;mt=8"></noscript>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#230b4f;color:#fff;font:16px system-ui,sans-serif;text-align:center}.btn{display:inline-block;margin-top:18px;padding:16px 28px;border-radius:999px;background:#ffd23f;color:#230b4f;font-weight:800;font-size:19px;text-decoration:none;box-shadow:0 6px 0 #c99a00}.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #c99a00}</style>
</head>
<body>
<p>Opening the App Store…<br><a id="to" class="btn" href="https://apps.apple.com/app/apple-store/id6819720504?pt=129570131&amp;ct=meta_rt&amp;mt=8">Open App Store</a></p>
<script>try{if(window.__to)document.getElementById('to').href=window.__to}catch(e){}</script>
</body>
</html>
