# Builds the Kalori calorie app (https://github.com/toto45678/kalori, a separate personal app of Tzach's)
# for iPhone and uploads it to TestFlight. It lives on this branch only because the App Store Connect
# secrets are in this repo. A short log is committed back to kalori-ci/last-run.txt on this branch.
name: Kalori iOS (TestFlight)
env:
  APP_VERSION: '1.0'
  BUNDLE_ID: com.sharlizstack.kalori
on:
  workflow_dispatch:
  push:
    branches: [claude/epic-bell-vty98f]
    paths: ['kalori-ci/trigger.txt', 'kalori-ci/asc.py', '.github/workflows/kalori-ios.yml']
permissions:
  contents: write
concurrency: { group: kalori-ios, cancel-in-progress: true }
jobs:
  ios:
    runs-on: macos-15
    steps:
      - name: Use Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"; xcodebuild -version
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: toto45678/kalori, path: kalori }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check the AI server
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/logs"; U=$(grep -o "const AI_SERVER='[^']*'" kalori/index.html | cut -d"'" -f2)
          { echo "server $U"; echo "ping: $(curl -s -m 20 $U/v1/ping)";
            echo "models: $(curl -s -m 30 -H 'x-device: ci-check' $U/v1/models | grep -o '"name": *"models/gemini[^"]*flash[^"]*"' | head -5 | tr '\n' ' ')";
            echo "no device: $(curl -s -m 20 -o /dev/null -w '%{http_code}' $U/v1/models)"; } | tee "$RUNNER_TEMP/logs/0-server.txt"
      - name: Create the iOS project
        working-directory: kalori/app
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          {
          npm run web
          npm install
          npx cap add ios --packagemanager CocoaPods
          npm run assets -- --ios
          PL=ios/App/App/Info.plist
          B=/usr/libexec/PlistBuddy
          $B -c "Delete :UISupportedInterfaceOrientations" $PL || true
          $B -c "Add :UISupportedInterfaceOrientations array" -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $PL
          $B -c "Delete :UISupportedInterfaceOrientations~ipad" $PL || true
          $B -c "Add :UIRequiresFullScreen bool true" $PL || true
          $B -c "Add :ITSAppUsesNonExemptEncryption bool false" $PL || true
          $B -c "Set :CFBundleDisplayName קלוריות" $PL || $B -c "Add :CFBundleDisplayName string קלוריות" $PL
          $B -c "Delete :CFBundleLocalizations" $PL || true
          $B -c "Add :CFBundleLocalizations array" -c "Add :CFBundleLocalizations:0 string he" -c "Add :CFBundleLocalizations:1 string en" $PL
          $B -c "Set :CFBundleDevelopmentRegion he" $PL || true
          $B -c "Add :NSHealthShareUsageDescription string האפליקציה קוראת כמה קלוריות שרפת (פעילות ומנוחה) ואת המשקל שלך, כדי לחשב גירעון יומי. הנתונים נשארים בטלפון." $PL
          $B -c "Add :NSHealthUpdateUsageDescription string האפליקציה לא כותבת נתונים לאפליקציית הבריאות." $PL
          $B -c "Add :NSCameraUsageDescription string כדי לצלם את האוכל ולחשב קלוריות." $PL
          $B -c "Add :NSPhotoLibraryUsageDescription string כדי לבחור תמונת אוכל או צילום מסך." $PL
          cat > ios/App/App/App.entitlements <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.developer.healthkit</key><true/>
            <key>com.apple.developer.healthkit.access</key><array/>
          </dict></plist>
          XML
          sed -i '' 's/^ *//' ios/App/App/App.entitlements
          sed -i '' -E "s#(PRODUCT_BUNDLE_IDENTIFIER = [^;]+;)#\1 CODE_SIGN_ENTITLEMENTS = App/App.entitlements;#" ios/App/App.xcodeproj/project.pbxproj
          npx cap sync ios
          grep -q KaloriHealthPlugin ios/App/App/capacitor.config.json || { echo "::error::KaloriHealth plugin missing from the iOS build"; cat ios/App/App/capacitor.config.json; exit 1; }
          grep -q LocalNotifications ios/App/App/capacitor.config.json || { echo "::error::LocalNotifications missing"; exit 1; }
          grep -q PreferencesPlugin ios/App/App/capacitor.config.json || { echo "::error::Preferences (durable storage) missing"; exit 1; }
          grep -E 'CODE_SIGN_ENTITLEMENTS|PRODUCT_BUNDLE_IDENTIFIER' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' -E 's/TARGETED_DEVICE_FAMILY = "?1,2"?;/TARGETED_DEVICE_FAMILY = 1;/' ios/App/App.xcodeproj/project.pbxproj   # iPhone only (no iPad screenshots needed)
          grep -m2 TARGETED_DEVICE_FAMILY ios/App/App.xcodeproj/project.pbxproj || true
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = ${{ env.APP_VERSION }};/; s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/" ios/App/App.xcodeproj/project.pbxproj
          } 2>&1 | tee "$RUNNER_TEMP/logs/1-project.txt"
      - name: Bundle ID + HealthKit in App Store Connect
        id: asc
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -o pipefail
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography || python3 -m pip install --quiet pyjwt cryptography
          python3 kalori-ci/asc.py 2>&1 | tee "$RUNNER_TEMP/logs/2-asc.txt"
      - name: Archive, sign, upload to TestFlight
        working-directory: kalori/app/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          HAS_APP: ${{ steps.asc.outputs.has_app }}
        run: |
          set -o pipefail
          L="$RUNNER_TEMP/logs"
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO archive > "$L/3-archive.txt" 2>&1 \
            || { grep -E 'error:' "$L/3-archive.txt" | head -30; exit 1; }
          # the archive is unsigned: put the HealthKit entitlement on the app so the export keeps it
          APPDIR="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          codesign --force --sign - --entitlements App/App.entitlements "$APPDIR"
          codesign -d --entitlements :- "$APPDIR" | tee "$L/4-entitlements.txt"
          if [ "$HAS_APP" != "yes" ]; then
            echo "::error::No app record for $BUNDLE_ID in App Store Connect yet. Create it (My Apps → + → New App), then run again." | tee -a "$L/5-export.txt"
            exit 1
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF2
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF2
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" 2>&1 | tee "$L/5-export.txt"
          rm -f "$KEY_PATH"
      - name: Write the short log back to this branch
        if: always()
        run: |
          L="$RUNNER_TEMP/logs"; O=kalori-ci/last-run.txt
          {
            echo "run ${{ github.run_number }} · ${{ job.status }} · $(date -u '+%Y-%m-%d %H:%M UTC') · kalori $(git -C kalori rev-parse --short HEAD 2>/dev/null)"
            for f in $(ls "$L" 2>/dev/null | sort); do
              echo; echo "===== $f"
              if [ "$f" = 3-archive.txt ]; then grep -E ' error:|ARCHIVE (SUCCEEDED|FAILED)' "$L/$f" | head -30; continue; fi
              grep -iE 'error|warning: .*(entitle|provision|sign)|exists|created|capabilit|HealthKit|record|EXPORT SUCCEEDED|Upload|uploaded|succeeded|failed' "$L/$f" | grep -v '^\s*$' | head -60
              echo "----- tail"; tail -25 "$L/$f"
            done
          } > "$O" 2>&1
          git config user.name "kalori-ci"; git config user.email "kalori-ci@users.noreply.github.com"
          git add "$O"; git commit -m "kalori-ci: log of run ${{ github.run_number }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
