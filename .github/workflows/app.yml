# Builds the native store apps from the same game code (no Mac needed).
#  - Android: a test APK you can install on any Android phone + an AAB for Google Play
#    (signed with the upload key when the ANDROID_UPLOAD_KEYSTORE / ANDROID_UPLOAD_PASSWORD secrets exist)
#  - iOS: signs the app with the App Store Connect API key and uploads it to TestFlight
# Output files are in the run's "Artifacts" box on GitHub (Actions tab -> this run).
# iOS secrets: APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY, APPLE_TEAM_ID
name: Build store apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'app/**', 'art/**', 'tools/build.py', '.github/workflows/app.yml']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Store build of the game
        run: python3 tools/build.py --store
      - name: Create the Android project
        working-directory: app
        run: |
          npm install
          npx cap add android
          npm run assets -- --android
          # portrait only, Play's required target API 36
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          sed -i -E 's/(targetSdkVersion\s*=\s*)[0-9]+/\136/; s/(compileSdkVersion\s*=\s*)[0-9]+/\136/' android/variables.gradle
          grep -E 'targetSdk|compileSdk|minSdk' android/variables.gradle
          # Google Play needs a higher versionCode on every upload: the run number (same as the iOS build number)
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName "[^"]*"/versionName "1.0"/' android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
          npx cap sync android
      - name: Build APK (test) + AAB (store)
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
      - name: Sign the AAB with the upload key (Google Play)
        working-directory: app/android/app/build/outputs/bundle/release
        env:
          KS_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::warning::No ANDROID_UPLOAD_KEYSTORE secret, so the AAB is unsigned and Google Play will refuse it"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          AAB=$(ls *.aab | head -1)
          jarsigner -keystore "$RUNNER_TEMP/upload.p12" -storetype PKCS12 -storepass "$KS_PASS" -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" upload
          rm -f "$RUNNER_TEMP/upload.p12"
          jarsigner -verify "$AAB"
          mv "$AAB" "sharliz-tower-${{ github.run_number }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: sharliz-android
          path: |
            app/android/app/build/outputs/apk/debug/*.apk
            app/android/app/build/outputs/bundle/release/*.aab

  ios:
    runs-on: macos-15
    steps:
      - name: Use Xcode 26 (App Store uploads need the iOS 26 SDK)
        run: |
          ls -d /Applications/Xcode_26*.app
          XC=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Store build of the game
        run: python3 tools/build.py --store
      - name: Create the iOS project
        working-directory: app
        run: |
          npm install
          npx cap add ios --packagemanager CocoaPods
          npm run assets -- --ios
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $PL || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $PL
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" $PL || true
          # portrait-only on iPad is allowed only when the app opts out of iPad multitasking
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" $PL || /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" $PL
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PL || true
          # the game picks the phone language from navigator.languages; in WKWebView that only follows languages the bundle declares
          /usr/libexec/PlistBuddy -c "Delete :CFBundleLocalizations" $PL || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" $PL
          i=0; for L in en he es pt fr de it ru tr ar ja ko zh-Hans id; do /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:$i string $L" $PL; i=$((i+1)); done
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Sharliz" $PL || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Sharliz" $PL
          npx cap sync ios
      - name: Version 1.0, build number = run number
        working-directory: app/ios/App
        run: |
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = 1.0;/; s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/" App.xcodeproj/project.pbxproj
          grep -E 'MARKETING_VERSION|CURRENT_PROJECT_VERSION|PRODUCT_BUNDLE_IDENTIFIER' App.xcodeproj/project.pbxproj
      - name: Sign + upload to TestFlight
        working-directory: app/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO archive > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -E 'error:' "$RUNNER_TEMP/archive.log"; tail -40 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/archive.log"
          # the export step signs with Apple's cloud-managed distribution certificate (needs the Admin API key)
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY_PATH"
