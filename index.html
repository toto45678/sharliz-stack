<!doctype html><html lang="he" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="שארליז">
<meta name="theme-color" content="#3a1a8a"><meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" type="image/png" href="icons/icon-192.png">
<style>html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#pwaHint{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:99999;background:#1b1240;color:#fff;border:3px solid #120d2b;border-radius:18px;padding:12px 44px 12px 14px;font:600 15px/1.35 Rubik,system-ui,sans-serif;box-shadow:0 6px 0 #0a0620,0 10px 30px rgba(0,0,0,.4);direction:rtl}
#pwaHint b{color:#ffd23f}#pwaHint button{position:absolute;top:8px;left:10px;background:none;border:0;color:#fff;font-size:22px;line-height:1}</style>
</head><body>
<title>Sharliz Stack</title>
<style>
@font-face{font-family:'Lilita One';src:url(art/fonts/lilita.woff) format('woff');font-display:swap}
@font-face{font-family:'Secular One';src:url(art/fonts/secular.woff) format('woff');font-display:swap}
@font-face{font-family:'Rubik';src:url(art/fonts/rubik.woff) format('woff');font-weight:500 800;font-display:swap}
/* ===== Sharliz Stack — chunky mobile-arcade UI =====
   Chunky outlined type, two-tone glossy buttons with a hard bottom lip,
   deep-blue panels with lighter tiles, dark capsules for counters, bouncy pop-ins.
   The worlds keep their psychedelic paint; the chrome on top is clean and loud. */
:root{
  --ink:#120d2b;
  --gf:'Lilita One','Secular One',system-ui,sans-serif;
  --display:var(--gf);
  --body:'Rubik','Secular One',system-ui,sans-serif;
  --y1:#ffe24d;--y2:#ffad00;
  --g1:#8ef043;--g2:#3db618;
  --b1:#5cbaff;--b2:#2279ea;
  --r1:#ff6d80;--r2:#e2233f;
  --p1:#c08bff;--p2:#7b3cf0;
  --o1:#ffb347;--o2:#ff7a00;
  --panel1:#3f75f2;--panel2:#2547b7;--panelDeep:#1b2f85;
  --tile1:#6198ff;--tile2:#3e6ce4;
  --cap:rgba(14,12,46,.78);
  --gold:#ffd23f;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#0d0a26;color:#fff;font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;font-synthesis:none}
#app{position:fixed;inset:0;overflow:hidden;background:#0d0a26}
#stage{display:block;position:absolute;inset:0;touch-action:none}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
img{-webkit-user-drag:none}

/* outlined display text */
.ot,.btn,.ribbon,.plaque,.side-btn b,.coin-pill,.pin,.buy,.toggle button,.tab,.bt-s{font-family:var(--gf);font-weight:400;letter-spacing:.01em}
.ot,.btn,.plaque,.side-btn b,.coin-pill,.buy,.toggle button[aria-pressed="true"],.pin,.ribbon{color:#fff;-webkit-text-stroke:var(--sw,4px) var(--ink);paint-order:stroke fill;text-shadow:0 var(--sh,3px) 0 var(--ink)}

/* ---------- buttons: two-tone gloss, hard lip ---------- */
.btn{--c1:var(--b1);--c2:var(--b2);position:relative;font-size:1.4rem;line-height:1;border:3.5px solid var(--ink);border-radius:16px;padding:.5em 1.1em .55em;min-height:58px;
  background:linear-gradient(180deg,var(--c1) 0 48%,var(--c2) 52% 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(0,0,0,.2),0 6px 0 var(--ink),0 10px 14px rgba(0,0,0,.25);
  display:inline-flex;align-items:center;justify-content:center;gap:.4em;transition:transform .09s,box-shadow .09s;overflow:visible}
.btn::before{content:'';position:absolute;left:7px;right:7px;top:4px;height:34%;border-radius:11px 11px 5px 5px;background:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,.08));pointer-events:none}
.btn:active{transform:translateY(5px);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(0,0,0,.2),0 1px 0 var(--ink)}
.btn.primary{--c1:var(--y1);--c2:var(--y2);font-size:1.6rem}
.btn.green{--c1:var(--g1);--c2:var(--g2)}
.btn.red{--c1:var(--r1);--c2:var(--r2)}
.btn.purple{--c1:var(--p1);--c2:var(--p2)}
.btn svg,.btn img.ico{width:1.15em;height:1.15em;flex:none;object-fit:contain;filter:drop-shadow(0 2px 0 var(--ink))}
.btn svg path{fill:#fff;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;paint-order:stroke}
.btn[disabled]{filter:grayscale(.85) brightness(.85)}

.round-btn{position:relative;width:50px;height:50px;flex:none;border-radius:14px;border:3.5px solid var(--ink);padding:0;display:grid;place-items:center;
  background:linear-gradient(180deg,var(--b1) 0 48%,var(--b2) 52% 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 5px 0 var(--ink);transition:transform .08s}
.round-btn:active{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 1px 0 var(--ink)}
.round-btn img,.round-btn .ico{width:76%;height:76%;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(18,13,43,.6))}
.round-btn svg{width:26px;height:26px}
.round-btn svg path{stroke:#fff;filter:drop-shadow(0 2px 0 var(--ink))}
.round-btn.icon-only{background:linear-gradient(180deg,var(--b1) 0 48%,var(--b2) 52% 100%)}

/* dark capsule counters */
.plaque{display:inline-flex;align-items:center;justify-content:center;gap:.35em;background:var(--cap);border:3px solid var(--ink);border-radius:999px;box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 3px 0 rgba(0,0,0,.35);--sw:3.5px;--sh:2px}
.coin-pill{display:inline-flex;align-items:center;gap:.3em;font-size:1.1rem;background:var(--cap);border:3px solid var(--ink);border-radius:999px;padding:2px 12px 2px 4px;box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 3px 0 rgba(0,0,0,.35);--sw:3.5px;--sh:2px;font-variant-numeric:tabular-nums;direction:ltr}
.coin-i{width:1.35em;height:1.35em;vertical-align:-.3em;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(18,13,43,.55))}
.coin-pill .coin-i{width:1.7em;height:1.7em;margin:-6px 0 -6px -8px}

/* segmented toggles */
.toggle{display:inline-flex;gap:3px;padding:3px;border-radius:12px;border:3px solid var(--ink);background:rgba(10,14,60,.55);box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.toggle button{border:0;border-radius:9px;padding:.32em .85em .38em;font-size:1rem;background:transparent;color:#b9cbff}
.toggle button[aria-pressed="true"]{background:linear-gradient(180deg,var(--y1) 0 48%,var(--y2) 52% 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 2px 0 var(--ink);--sw:3px;--sh:2px}

/* ---------- big gradient lettering ---------- */
.bt{position:relative;display:inline-block;font-family:var(--gf);line-height:1.05;white-space:nowrap}
.bt-s,.bt-f{display:block}
.bt-s{position:absolute;inset:0;color:var(--ink);-webkit-text-stroke:.2em var(--ink);paint-order:stroke fill;text-shadow:0 .12em 0 var(--ink),0 .16em .2em rgba(0,0,0,.35)}
.bt-f{position:relative;background:linear-gradient(180deg,#fffbe0 0%,#ffe24d 34%,#ffb000 64%,#ff7a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.bt.blue .bt-f{background-image:linear-gradient(180deg,#f2fbff 0%,#9be0ff 40%,#3aa4ff 70%,#1f6ae0 100%)}
.bt.pink .bt-f{background-image:linear-gradient(180deg,#fff0f6 0%,#ff9ccb 38%,#ff3e8f 70%,#c81e66 100%)}
.bt.green .bt-f{background-image:linear-gradient(180deg,#f4ffe8 0%,#b8f56b 40%,#58cc22 72%,#2f8f0f 100%)}
.bt.white .bt-f{background-image:linear-gradient(180deg,#fff 0%,#fff 55%,#d7e2ff 100%)}

/* ---------- overlay & panels ---------- */
#overlay{position:absolute;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 70px) 14px calc(env(safe-area-inset-bottom,0px) + 18px);overflow:hidden}
#overlay.dim{background:radial-gradient(ellipse at 50% 42%,rgba(40,50,140,.55),rgba(6,4,22,.86));-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#overlay.top{align-items:flex-start}
#overlay.center{align-items:center}
#overlay.rays::before{content:'';position:absolute;left:50%;top:34%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(from 0deg,rgba(255,236,140,.22) 0 9deg,rgba(255,236,140,0) 9deg 22.5deg);animation:spin 26s linear infinite;pointer-events:none;-webkit-mask:radial-gradient(circle,#000 0,#000 18%,transparent 55%);mask:radial-gradient(circle,#000 0,#000 18%,transparent 55%)}
@keyframes spin{to{transform:rotate(360deg)}}
.card{position:relative;width:100%;max-width:384px;max-height:100%;display:flex;flex-direction:column;align-items:center;gap:11px;text-align:center;color:#fff;
  background:linear-gradient(180deg,var(--panel1) 0%,var(--panel2) 100%);border:4px solid var(--ink);border-radius:24px;padding:0 16px 18px;
  box-shadow:inset 0 0 0 3px rgba(150,190,255,.35),inset 0 5px 0 rgba(255,255,255,.22),0 8px 0 var(--ink),0 22px 44px rgba(0,0,0,.5);
  animation:cardIn .45s cubic-bezier(.3,1.6,.55,1) both}
@keyframes cardIn{from{transform:scale(.5) translateY(30px);opacity:0}60%{opacity:1}}
.card>.ribbon{align-self:stretch;margin:0 -16px 2px;padding:15px 52px 13px;font-size:1.85rem;line-height:1.05;--sw:5px;--sh:4px;
  background:linear-gradient(180deg,#2c55d0,var(--panelDeep));border-bottom:4px solid var(--ink);border-radius:20px 20px 0 0;box-shadow:inset 0 3px 0 rgba(255,255,255,.18);white-space:normal}
.card>.ribbon.mustard{background:linear-gradient(180deg,#ffbf1f,#ff8a00)}
.card>.ribbon.pink{background:linear-gradient(180deg,#ff5fa2,#d61f6b)}
.card .x-btn{position:absolute;top:10px;inset-inline-end:10px;width:42px;height:42px;border-radius:12px;border:3.5px solid var(--ink);background:linear-gradient(180deg,var(--r1) 0 48%,var(--r2) 52% 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 4px 0 var(--ink);display:grid;place-items:center;padding:0;z-index:2}
.card .x-btn:active{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 1px 0 var(--ink)}
.card .x-btn svg{width:20px;height:20px}
.card-body{width:100%;display:flex;flex-direction:column;align-items:center;gap:11px;overflow-y:auto;overflow-x:hidden;min-height:0;padding:2px 2px 6px;scrollbar-width:none}
.card-body::-webkit-scrollbar{display:none}
.card.win{background:linear-gradient(180deg,#4a7ff5 0%,#2547b7 100%);padding-top:4px}
.card-title{margin:-58px 0 0;font-size:clamp(2.6rem,13vw,3.4rem);animation:stamp .55s cubic-bezier(.3,1.7,.5,1) both;z-index:2}
@keyframes stamp{0%{transform:scale(.2) rotate(-10deg);opacity:0}100%{transform:none;opacity:1}}
.card-anim{display:block;margin:0 auto -6px;pointer-events:none;filter:drop-shadow(0 6px 0 rgba(10,8,40,.35))}
.card p{margin:0;font-size:1rem;line-height:1.35;color:#e6eeff;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(10,10,50,.55)}
.stars{display:flex;gap:2px;align-items:flex-end}
.stars img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 4px 0 rgba(10,8,40,.55));animation:starPop .5s cubic-bezier(.3,1.8,.5,1) both}
.stars img:nth-child(2){width:78px;height:78px;margin-bottom:14px;animation-delay:.15s}.stars img:nth-child(3){animation-delay:.3s}
.stars img.off,.pin-stars img.off,.hearts img.off{filter:grayscale(1) brightness(.32) drop-shadow(0 3px 0 rgba(10,8,40,.4));opacity:.9}
@keyframes starPop{0%{transform:scale(0) rotate(-40deg)}100%{transform:none}}
.actions{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:2px}
.actions .btn{width:100%}
.actions.row{flex-direction:row}.actions.row .btn{flex:1;font-size:1.2rem;padding-inline:.4em}

/* light tiles inside panels */
.tile,.shop-item,.mission,.pre-row,.al-item,.skin-item,.tally-row,.opt-row,.mode-btn,.pre-ms{background:linear-gradient(180deg,var(--tile1),var(--tile2));border:3px solid var(--ink);border-radius:14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 rgba(8,10,40,.55)}
.opt-row{display:flex;justify-content:space-between;align-items:center;width:100%;gap:12px;padding:7px 8px 7px 12px;font-family:var(--gf);font-size:1.08rem;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink)}
.opt-row .toggle{-webkit-text-stroke:0;text-shadow:none}

/* ---------- toast banner & hints ---------- */
#toast{position:absolute;top:34%;inset-inline:0;display:flex;justify-content:center;z-index:4;pointer-events:none}
#toast .plaque{width:100%;border-radius:0;border-width:4px 0;padding:.45em 1em .55em;flex-direction:column;gap:0;background:linear-gradient(180deg,rgba(40,70,200,.92),rgba(22,36,120,.92));text-align:center;animation:toast 2.1s cubic-bezier(.3,1.5,.5,1) forwards;text-shadow:none;-webkit-text-stroke:0}
#toast small{display:block;font-family:var(--gf);font-size:1.05rem;letter-spacing:.06em;color:var(--y1);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink)}
#toast strong{font-family:var(--gf);font-weight:400;font-size:2.3rem;line-height:1.05;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
@keyframes toast{0%{opacity:0;transform:scaleY(0)}10%{opacity:1;transform:scaleY(1.1)}16%{transform:none}82%{opacity:1;transform:none}100%{opacity:0;transform:scaleY(.2)}}
#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);inset-inline:0;text-align:center;font-family:var(--gf);font-size:1.35rem;color:#fff;z-index:3;pointer-events:none;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);animation:hintPulse 1.1s ease-in-out infinite}
@keyframes hintPulse{50%{transform:scale(1.08)}}
.coin-toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--gf);font-size:1.6rem;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);background:linear-gradient(180deg,var(--y1) 0 48%,var(--y2) 52%);border:3.5px solid var(--ink);border-radius:999px;padding:6px 20px 8px 10px;z-index:99;box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 5px 0 var(--ink);animation:popIn .4s cubic-bezier(.3,1.8,.5,1);display:flex;align-items:center;gap:6px;white-space:nowrap}
@keyframes popIn{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;inset-inline:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;z-index:3;pointer-events:none;display:grid;gap:8px;justify-items:center}
.hud-top{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
#hud button{pointer-events:auto}
.hearts{display:flex;gap:0;justify-self:start;padding:2px 6px;background:var(--cap);border:3px solid var(--ink);border-radius:999px}
.hearts img{width:30px;height:30px;object-fit:contain;display:block;filter:drop-shadow(0 2px 0 rgba(10,8,40,.6))}
.level-plaque{font-size:1.15rem;padding:.25em .9em .3em;white-space:nowrap}
.hud-end{justify-self:end;display:flex;align-items:center;gap:8px}
.score-plaque{font-size:1.15rem;padding:.25em .7em .3em;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
.hud-sub{display:flex;gap:10px;align-items:flex-start;min-height:52px}
.gizmo{display:flex;flex-direction:column;align-items:center;gap:0;font-family:var(--gf);font-size:1rem;color:#fff;-webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink);transition:opacity .3s}
.gizmo img{display:block;height:auto;filter:drop-shadow(0 3px 0 rgba(10,8,40,.5))}
#windVal{color:var(--y1)}
#sockImg{width:60px;transform-origin:22% 30%;transition:transform .5s;animation:sockwag .6s ease-in-out infinite alternate}
@keyframes sockwag{from{rotate:-4deg}to{rotate:4deg}}
#dialImg{width:56px;animation:dialshake .3s steps(2) infinite}
@keyframes dialshake{from{translate:-1px 0}to{translate:1px 0}}
#gauge{position:absolute;inset-inline-end:8px;top:24%;height:42%;width:40px;z-index:3;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px}
#gauge>svg{display:none}
#gauge .g-ic{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(10,8,40,.6))}
#gauge .tube{flex:1;width:20px;border:3px solid var(--ink);border-radius:999px;background:rgba(14,12,46,.7);position:relative;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 2px 4px rgba(0,0,0,.5)}
#gauge .tube i{position:absolute;bottom:0;left:0;right:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 6px,transparent 6px 12px),linear-gradient(90deg,#ffb000,#ffe24d 45%,#ffb000);transition:height .35s cubic-bezier(.3,1.5,.5,1);border-top:2px solid var(--ink)}
#gauge b{font-family:var(--gf);font-weight:400;font-size:1rem;color:#fff;-webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink);font-variant-numeric:tabular-nums}
#boosterBar{position:absolute;left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 60px);display:flex;flex-direction:column;gap:10px;z-index:5;background:none;padding:0}
#boosterBar[hidden]{display:none}
.boost{position:relative;width:54px;height:54px;border-radius:16px;border:3.5px solid var(--ink);background:linear-gradient(180deg,var(--b1) 0 48%,var(--b2) 52% 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 5px 0 var(--ink);padding:5px;cursor:pointer;transition:transform .08s}
.boost:active{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 1px 0 var(--ink)}
.boost img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(10,8,40,.55))}
.boost i{position:absolute;right:-7px;top:-7px;font-style:normal;font-family:var(--gf);font-size:.85rem;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;background:linear-gradient(180deg,var(--r1),var(--r2));border:2.5px solid var(--ink);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;padding:0 5px;line-height:1}
.boost.active{background:linear-gradient(180deg,var(--g1) 0 48%,var(--g2) 52% 100%);animation:bob 1s ease-in-out infinite}
.boost.active::after{content:'';position:absolute;inset:-8px;border-radius:20px;border:3px solid #b8ff6a;animation:ringOut 1s ease-out infinite}
@keyframes ringOut{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
@keyframes bob{50%{transform:translateY(-4px)}}

/* ---------- lobby ---------- */
#title{position:absolute;inset:0;z-index:7;background:#1a1258}
#titleArt{position:absolute;inset:0;width:100%;height:100%}
.lob-top{position:absolute;top:0;inset-inline:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;z-index:3}
.lob-top .sp{flex:1}
.profile{display:flex;align-items:center;gap:6px;background:var(--cap);border:3px solid var(--ink);border-radius:16px;padding:3px 10px 3px 3px;box-shadow:0 3px 0 rgba(0,0,0,.35);min-width:0}
.profile .av{width:42px;height:42px;border-radius:11px;border:3px solid var(--ink);background:linear-gradient(180deg,#ffd84a,#ff8f1f);display:grid;place-items:center;overflow:hidden;flex:none}
.profile .av canvas{width:42px;height:42px}
.profile .pf{display:flex;flex-direction:column;line-height:1;gap:3px;min-width:0}
.profile .pf b{font-family:var(--gf);font-weight:400;font-size:1rem;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink);white-space:nowrap}
.profile .pf span{display:flex;align-items:center;gap:3px;font-family:var(--gf);font-size:.9rem;color:var(--y1);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;white-space:nowrap}
.profile .pf span img{width:18px;height:18px}
.lob-top .coin-pill{font-size:1.05rem}
.plus{width:24px;height:24px;margin-inline-start:4px;border-radius:7px;border:2.5px solid var(--ink);background:linear-gradient(180deg,var(--g1) 0 48%,var(--g2) 52%);display:grid;place-items:center;font-size:1.05rem;line-height:1;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;padding:0;margin-inline-end:-6px}
.logo{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);z-index:2;text-align:center;pointer-events:none;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.logo.img img{display:block;width:min(60vw,255px);height:auto;transform:rotate(-2deg);animation:logoIn .7s cubic-bezier(.3,1.7,.5,1) both}
.logo .l1{font-size:clamp(3.2rem,16.5vw,4.6rem);transform:rotate(-3deg);animation:logoIn .7s cubic-bezier(.3,1.7,.5,1) both}
.logo .l2{margin-top:-.25em;font-size:clamp(1.6rem,8vw,2.2rem);transform:rotate(-3deg);animation:logoIn .7s .12s cubic-bezier(.3,1.7,.5,1) both}
@keyframes logoIn{from{transform:scale(.2) rotate(-12deg);opacity:0}}
.lob-side{position:absolute;top:calc(env(safe-area-inset-top,0px) + 196px);display:flex;flex-direction:column;gap:14px;z-index:3}
.lob-side.l{left:10px}.lob-side.r{right:10px}
.side-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;width:66px;padding:0;border:0;background:none}
.side-btn .sq{width:60px;height:60px;border-radius:17px;border:3.5px solid var(--ink);background:linear-gradient(180deg,var(--b1) 0 48%,var(--b2) 52% 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 5px 0 var(--ink);display:grid;place-items:center;transition:transform .08s}
.side-btn.purple .sq{background:linear-gradient(180deg,var(--p1) 0 48%,var(--p2) 52% 100%)}
.side-btn.pinkb .sq{background:linear-gradient(180deg,var(--r1) 0 48%,var(--r2) 52% 100%)}
.side-btn.orange .sq{background:linear-gradient(180deg,var(--o1) 0 48%,var(--o2) 52% 100%)}
.side-btn.green .sq{background:linear-gradient(180deg,var(--g1) 0 48%,var(--g2) 52% 100%)}
.side-btn .sq img{width:118%;height:118%;object-fit:contain;margin-top:-10px;filter:drop-shadow(0 3px 0 rgba(10,8,40,.55))}
.side-btn:active .sq{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 1px 0 var(--ink)}
.side-btn b{margin-top:2px;font-size:.88rem;--sw:3.5px;--sh:2px;white-space:nowrap;line-height:1.1}
.badge{position:absolute;top:-6px;right:-2px;min-width:24px;height:24px;border-radius:999px;border:2.5px solid var(--ink);background:linear-gradient(180deg,var(--r1),var(--r2));font-family:var(--gf);font-size:.85rem;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;display:grid;place-items:center;padding:0 5px;line-height:1;font-style:normal;animation:bob 1.2s ease-in-out infinite;z-index:2}
.lob-bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);inset-inline:10px;display:flex;align-items:stretch;gap:10px;z-index:3;direction:ltr}
.world-card{flex:1.05;min-width:0;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 6px;border-radius:18px;border:3.5px solid var(--ink);background:linear-gradient(180deg,#3f75f2,#2547b7);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),0 6px 0 var(--ink);text-align:start;transition:transform .08s}
.world-card:active{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),0 2px 0 var(--ink)}
.world-card .wthumb{width:54px;height:54px;border-radius:12px;border:3px solid var(--ink);object-fit:cover;flex:none;background:#2a2a7a}
.world-card .wtxt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.world-card .wtxt small{font-family:var(--gf);font-size:.78rem;color:#b9d2ff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;white-space:nowrap}
.world-card .wtxt b{font-family:var(--gf);font-weight:400;font-size:1.12rem;color:#fff;-webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.wbar{position:relative;height:16px;border-radius:999px;border:2.5px solid var(--ink);background:rgba(10,14,60,.7);overflow:hidden}
.wbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#ffe24d,#ffad00);border-right:2px solid var(--ink)}
.wbar span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--gf);font-size:.72rem;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;line-height:1}
.play-big{flex:1;min-height:76px;flex-direction:column;gap:0;font-size:2.1rem;--sw:5px;--sh:4px;border-radius:20px;border-width:4px}
.play-big small{font-size:.95rem;--sw:3px;color:#fff6cf;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.play-big .pl{display:flex;align-items:center;gap:.2em;line-height:1}
.play-big .pl svg{width:.8em;height:.8em}
.play-big{animation:playPulse 1.8s ease-in-out infinite}
@keyframes playPulse{0%,100%{transform:none}50%{transform:scale(1.035)}}
.play-big:active{animation:none}
.lob-tip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 104px);z-index:3;font-family:var(--gf);font-size:1rem;color:#fff;-webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink);white-space:nowrap;pointer-events:none;opacity:.95}
.lob-tip img{width:1.3em;height:1.3em;vertical-align:-.3em}

/* ---------- map ---------- */
#map{position:absolute;inset:0;z-index:6;background:#2a2a7a}
#mapScroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#mapInner{position:relative;width:100%}
#mapClouds{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
canvas.fog-lift{position:absolute;z-index:1;opacity:0;filter:blur(8px) saturate(.5);transition:opacity 1.6s ease,filter 1.8s ease;pointer-events:none}
canvas.fog-lift.on{opacity:1;filter:none}
i.fog-puff{position:absolute;z-index:3;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 40% 35%,#fff,rgba(246,242,255,.85) 45%,rgba(246,242,255,0) 70%);transition:transform 1.8s cubic-bezier(.2,.7,.3,1),opacity 1.6s ease .15s}
.pin.pop{animation:pinpop .55s cubic-bezier(.3,1.7,.5,1) both}
@keyframes pinpop{from{scale:0}to{scale:1}}
#mapCanvas{position:absolute;top:0;left:0;display:block}
.map-top{position:absolute;top:0;inset-inline:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 12px;pointer-events:none;z-index:3;background:linear-gradient(rgba(10,8,40,.55),rgba(10,8,40,0))}
.map-top>*{pointer-events:auto}
.map-title{flex:1;min-width:0;font-size:1.15rem;padding:.3em .8em .35em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star-total{font-size:1.05rem;padding:.25em .7em .3em .3em;white-space:nowrap;font-variant-numeric:tabular-nums;direction:ltr}
.star-total img{width:1.5em;height:1.5em;margin:-6px 0;object-fit:contain}
.pin{position:absolute;width:52px;height:52px;padding:0;border-radius:50%;transform:translate(-50%,-50%);border:4px solid var(--ink);display:grid;place-items:center;z-index:2;font-size:1.3rem;font-variant-numeric:tabular-nums;--sw:4px;--sh:2px;
  background:radial-gradient(circle at 50% 30%,#8cc8ff,#2f7be8 62%,#1f56c0);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -4px 0 rgba(0,0,0,.25),0 5px 0 var(--ink),0 9px 10px rgba(0,0,0,.35);transition:transform .1s}
.pin:active{transform:translate(-50%,-46%)}
.pin.done{background:radial-gradient(circle at 50% 30%,#c4ff84,#52c41f 62%,#2f8f0f)}
.pin.gold{background:radial-gradient(circle at 50% 30%,#fff6a8,#ffc21a 60%,#e08800);box-shadow:inset 0 3px 0 rgba(255,255,255,.6),inset 0 -4px 0 rgba(0,0,0,.2),0 5px 0 var(--ink),0 0 18px rgba(255,214,60,.9)}
.pin.current{width:66px;height:66px;font-size:1.6rem;background:radial-gradient(circle at 50% 30%,#fff3a0,#ffc21a 60%,#ff8a00);animation:pinbob 1.1s ease-in-out infinite;z-index:3}
.pin.current::after{content:'';position:absolute;inset:-12px;border-radius:50%;border:4px solid #fff;animation:ringOut 1.2s ease-out infinite}
.pin.locked{background:radial-gradient(circle at 50% 30%,#a6a9c9,#6d7096 62%,#4c4e70);color:transparent;-webkit-text-stroke:0;text-shadow:none}
.pin.locked svg{width:22px;height:22px}
.pin.locked .lk{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(10,8,40,.6))}
.pin.boss{width:64px;height:64px;background:radial-gradient(circle at 50% 30%,#ff9aa8,#e2233f 62%,#a0102a);overflow:visible;font-size:1.4rem}
.pin.boss.locked{background:radial-gradient(circle at 50% 30%,#c9a0aa,#8a5764 62%,#5c3440)}
.pin.boss.done{background:radial-gradient(circle at 50% 30%,#c4ff84,#52c41f 62%,#2f8f0f)}
.pin-boss{position:absolute;right:92%;top:50%;width:58px;height:auto;transform:translateY(-55%);pointer-events:none;filter:drop-shadow(0 3px 0 rgba(10,8,40,.45));animation:bob 1.6s ease-in-out infinite}
.pin.locked .pin-boss{filter:grayscale(.7) brightness(.8) drop-shadow(0 3px 0 rgba(10,8,40,.45))}
@keyframes pinbob{50%{transform:translate(-50%,calc(-50% - 7px))}}
.pin.shake{animation:shake .35s}
@keyframes shake{25%{transform:translate(calc(-50% - 6px),-50%)}75%{transform:translate(calc(-50% + 6px),-50%)}}
.pin-stars{position:absolute;transform:translate(-50%,0);display:flex;gap:0;z-index:2;margin-top:24px;pointer-events:none}
.pin-stars img{width:20px;height:20px;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(10,8,40,.6))}
.pin-stars img:nth-child(2){margin-top:4px}
.map-ribbon{position:absolute;transform:translate(-50%,-50%);z-index:1;font-size:1.05rem;padding:.3em .9em .35em;border:3.5px solid var(--ink);border-radius:12px;background:linear-gradient(180deg,#ff5fa2,#d61f6b);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 4px 0 var(--ink);white-space:nowrap;--sw:4px;--sh:2px}
.map-ribbon.home{background:linear-gradient(180deg,var(--b1),var(--b2))}
.pin-gate{position:absolute;transform:translate(-50%,34px);font-family:var(--gf);font-size:.85rem;color:var(--y1);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;background:var(--cap);border:2.5px solid var(--ink);border-radius:999px;padding:1px 8px 2px;z-index:3;pointer-events:none;white-space:nowrap}
.map-chest{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border:0;background:none;padding:0;z-index:3;filter:grayscale(.75) brightness(.9)}
.map-chest img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 0 rgba(10,8,40,.5))}
.map-chest.ready{filter:none;animation:fogbob 1s ease-in-out infinite}
.map-chest.ready::before{content:'';position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(rgba(255,230,120,.75),transparent 65%);z-index:-1;animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{opacity:.4;transform:scale(1.15)}}
.map-chest.opened{opacity:.45}
.map-chest i{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--gf);font-size:.78rem;color:var(--y1);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;background:var(--cap);border:2px solid var(--ink);border-radius:999px;padding:0 6px 1px;white-space:nowrap}
#avatar{position:absolute;width:46px;height:70px;transform:translate(-50%,-100%);z-index:3;pointer-events:none;transition:left .9s cubic-bezier(.5,0,.3,1),top .9s cubic-bezier(.5,0,.3,1)}
.map-side{position:absolute;left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:4;display:flex;flex-direction:column;gap:10px}
.map-side .side-btn{width:60px}.map-side .side-btn .sq{width:52px;height:52px;border-radius:15px}
.shop-fab{position:absolute;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:4}
.shop-fab .sq{width:66px;height:66px}

/* ---------- shop ---------- */
.shop-card{max-width:410px}
.shop-top{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.shop-tabs{width:100%;display:flex}
.shop-tabs button{flex:1;font-size:1.05rem}
.shop-list{width:100%;display:flex;flex-direction:column;gap:9px;padding:4px 2px 6px}
.shop-item{position:relative;display:flex;align-items:center;gap:10px;padding:7px 8px}
.shop-item>img{width:58px;height:58px;object-fit:contain;flex:none;margin:-8px 0;filter:drop-shadow(0 3px 0 rgba(10,8,40,.5))}
.si-txt{flex:1;display:flex;flex-direction:column;line-height:1.15;text-align:start;gap:2px}
.si-txt b{font-family:var(--gf);font-weight:400;font-size:1.12rem;color:#fff;-webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink)}
.si-txt small{font-size:.78rem;color:#eaf1ff;font-weight:600;text-shadow:0 1px 0 rgba(10,10,50,.6)}
.buy{display:inline-flex;align-items:center;gap:2px;font-size:1.02rem;border:3px solid var(--ink);border-radius:12px;padding:5px 11px 7px 6px;white-space:nowrap;--sw:3.5px;--sh:2px;
  background:linear-gradient(180deg,var(--g1) 0 48%,var(--g2) 52% 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 var(--ink);transition:transform .08s}
.buy:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 1px 0 var(--ink)}
.buy[disabled]{filter:grayscale(.9) brightness(.8);cursor:default}
.buy .coin-i{width:1.4em;height:1.4em;margin:-6px 0}
.own{position:absolute;top:-9px;inset-inline-start:38px;font-style:normal;font-family:var(--gf);color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;background:linear-gradient(180deg,var(--r1),var(--r2));border:2.5px solid var(--ink);border-radius:999px;padding:0 7px 1px;font-size:.85rem}
.shop-list.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.shop-head{grid-column:1/-1;font-family:var(--gf);font-size:1.1rem;color:var(--y1);-webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink);text-align:start;margin-top:4px}
.skin-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 3px 7px;font-family:var(--gf);font-size:.85rem;color:#fff;cursor:pointer;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink);line-height:1.1;min-height:104px;justify-content:space-between}
.skin-item>img{width:62px;height:52px;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(10,8,40,.5))}
.skin-item em{font-style:normal;font-size:.82rem;color:var(--y1);display:flex;align-items:center;gap:1px;white-space:nowrap}
.skin-item em .coin-i{width:1.3em;height:1.3em;margin:-5px 0}
.skin-item.on{background:linear-gradient(180deg,var(--g1),var(--g2));box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 rgba(8,10,40,.55),0 0 0 3px #fff}
.skin-item.locked{background:linear-gradient(180deg,#4c5a9a,#36407a)}
.skin-item.locked>img{filter:brightness(.55) saturate(.4) drop-shadow(0 3px 0 rgba(10,8,40,.5))}
.noskin{width:52px;height:52px;display:grid;place-items:center;font-size:1.8rem;color:#c9d6ff;border-radius:50%}
.noskin.sw-c_chrome{background:linear-gradient(135deg,#eee,#888,#fff);border:3px solid var(--ink)}.noskin.sw-c_neon{background:linear-gradient(135deg,#0ff,#f0f,#ff0);border:3px solid var(--ink)}
.noskin.sw-c_midnight{background:linear-gradient(135deg,#1e1b6e,#4c1d95,#0ea5e9);border:3px solid var(--ink)}.noskin.sw-c_candy{background:linear-gradient(135deg,#ff9ecf,#fff,#7fe3ff);border:3px solid var(--ink)}
.noskin[class*="sw-t_"],.noskin[class*="sw-l_"]{font-size:1.7rem;color:#ff6db0;-webkit-text-stroke:2px var(--ink)}
.sw-t_stars::after{content:'★★'}.sw-t_hearts::after{content:'♥♥'}.sw-t_bubbles::after{content:'○○'}.sw-l_flowers::after{content:'✿'}.sw-l_fireworks::after{content:'✺'}.sw-l_coins::after{content:'◎'}

/* ---------- tally / win ---------- */
.tally{width:100%;max-width:320px;margin:2px auto 2px;display:flex;flex-direction:column;gap:5px;font-family:var(--gf)}
.tally-row,.tally-total{display:flex;align-items:center;gap:8px;padding:3px 10px 4px;opacity:0;animation:tallyIn .35s cubic-bezier(.3,1.6,.5,1) forwards}
.tally-row span{flex:1;text-align:start;color:#fff;font-size:1rem;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink)}
.tally-row b{font-weight:400;color:#ffd0ea;font-size:.95rem;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.tally-row em{font-style:normal;color:var(--y1);font-size:1.05rem;min-width:66px;text-align:end;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink);display:flex;align-items:center;justify-content:flex-end;gap:2px;direction:ltr}
.tally-total{background:linear-gradient(180deg,var(--y1) 0 48%,var(--y2) 52%);border:3.5px solid var(--ink);border-radius:14px;margin-top:3px;font-size:1.25rem;box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 4px 0 var(--ink);color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink)}
.tally-total span{flex:1;text-align:start}.tally-total strong{font-weight:400;font-size:1.5rem}
@keyframes tallyIn{from{opacity:0;transform:translateY(10px) scale(.85)}to{opacity:1;transform:none}}
.win-ms{display:flex;flex-direction:column;gap:3px;width:100%;max-width:320px}
.win-ms span{display:flex;align-items:center;gap:6px;font-size:.88rem;font-weight:700;color:#c3d3ff;text-align:start;background:rgba(10,14,70,.35);border-radius:10px;padding:3px 9px}
.win-ms span.ok{color:#fff;background:rgba(80,200,40,.35)}
.new-hat{display:flex;align-items:center;gap:8px;font-family:var(--gf);font-size:1.15rem;color:var(--y1);-webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink)}
.new-hat img{width:60px;height:auto;animation:starPop .6s cubic-bezier(.3,1.8,.5,1) both}
.share-btn{font-size:1.05rem;min-height:44px;padding:.35em 1em .4em}

/* ---------- pre-level / missions / album / modes ---------- */
.pre{width:100%;display:flex;flex-direction:column;gap:8px;font-size:.95rem}
.pre-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 12px 7px}
.pre-row b{font-family:var(--gf);font-weight:400;font-size:1.05rem;color:var(--y1);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink);white-space:nowrap}
.pre-row span{font-weight:700;color:#fff;text-shadow:0 1px 0 rgba(10,10,50,.6);text-align:end}
.pre-ms{display:flex;flex-direction:column;gap:4px;padding:8px 10px}
.pre-m{display:flex;gap:8px;align-items:center;color:#fff;font-weight:700;text-shadow:0 1px 0 rgba(10,10,50,.6);text-align:start}
.pre-m img{width:24px;height:24px;flex:none}
.pre-boost{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:6px}
.pre-b{width:56px;height:56px}
.pre-b i{background:linear-gradient(180deg,var(--g1),var(--g2))}
.gift{width:100%;text-align:center;font-family:var(--gf);color:var(--g1);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.mission-list{width:100%;display:flex;flex-direction:column;gap:9px}
.mission{display:flex;align-items:center;gap:10px;padding:7px 9px}
.mission img{width:46px;margin:-6px 0}
.m-txt{flex:1;display:flex;flex-direction:column;gap:3px;text-align:start}
.m-txt b{font-family:var(--gf);font-weight:400;color:#fff;font-size:1rem;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 var(--ink)}
.m-txt small{font-family:var(--gf);font-size:.8rem;color:#dbe6ff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill}
.m-txt i{display:block;height:14px;border-radius:99px;background:linear-gradient(180deg,#9bff5a,#3db618) 0 0/calc(var(--p)*100%) 100% no-repeat,rgba(10,14,60,.7);border:2.5px solid var(--ink)}

  else if(id==='drip'){g.fillStyle='#fff3fb';g.beginPath();g.moveTo(0,0);g.lineTo(0,H*.28);for(let i=0;i<=14;i++){const x=i*W/14,d=H*(.28+R()*.25);g.quadraticCurveTo(x-W/28,H*.3,x-W/56,d);g.arc(x-W/56+2,d,W/56-2,Math.PI,0,true);g.quadraticCurveTo(x,H*.3,x+W/56,H*.3)}g.lineTo(W,0);g.closePath();g.fill();

const BEATS={nervous:['peek','flinch'],goofy:['wiggle','bounce'],sweet:['doze','love'],grumpy:['huff','huff'],diva:['pose','pose']},BEATLEN={peek:1.6,flinch:.8,wiggle:1.4,bounce:1.2,doze:3.6,love:1.4,huff:1.2,pose:1.4};

  if(s._pa&&(time>s._pe||danger)){s._pa=null;s._pt=time+rnd(4,10)*(p==='goofy'?.6:1)}

/* a cartoon skull + spine in Tzach's golden-bone style */
function g3Skeleton(T){const g=new T.Group(),bone=new T.MeshPhysicalMaterial({color:'#f2c64e',roughness:.42,clearcoat:.5,clearcoatRoughness:.3}),
    ink=new T.MeshBasicMaterial({color:'#120d2b',side:T.BackSide}),dark=new T.MeshBasicMaterial({color:'#1a1020'});
  const hull=(m,s=1.08)=>{const h=new T.Mesh(m.geometry,ink);h.scale.setScalar(s);m.add(h);return m};
  const skull=new T.Group(),cr=hull(new T.Mesh(new T.SphereGeometry(.3,32,24),bone));cr.scale.set(1,.93,.9);skull.add(cr);
  for(const sx of[-1,1]){const e=new T.Mesh(new T.SphereGeometry(.088,20,14),dark);e.position.set(sx*.112,.03,.228);e.scale.set(1,1.18,.45);skull.add(e)}
  const nose=new T.Mesh(new T.ConeGeometry(.032,.06,3),dark);nose.position.set(0,-.075,.262);nose.rotation.z=Math.PI;nose.scale.z=.35;skull.add(nose);
  const jaw=new T.Group();jaw.position.set(0,-.2,.02);const jm=hull(new T.Mesh(new T.CapsuleGeometry(.075,.17,6,14),bone),1.12);jm.rotation.z=Math.PI/2;jm.scale.set(1,1,.85);jaw.add(jm);
  for(let i=0;i<4;i++){const tt=new T.Mesh(new T.BoxGeometry(.012,.07,.02),dark);tt.position.set(-.06+i*.04,.0,.07);jaw.add(tt)}skull.add(jaw);
  g.add(skull);const verts=[];
  for(let i=0;i<5;i++){const v=new T.Group(),c=hull(new T.Mesh(new T.CylinderGeometry(.085,.095,.085,20),bone),1.12);v.add(c);
    for(const sx of[-1,1]){const w=hull(new T.Mesh(new T.SphereGeometry(.045,12,10),bone),1.15);w.position.set(sx*.1,0,-.01);w.scale.set(1.2,.7,.8);v.add(w)}
    g.add(v);verts.push(v)}
  g.visible=false;return {g,skull,jaw,verts,bone}}

    else{applyLook(P,Object.assign({},LOOK0,{colorHex:col,color:'_',hat},PERS_LOOKX[PERS[col]]||{}));persBake(P,col)}
    if(col===GOLDC){P.bodyMat.metalness=.3;P.bodyMat.roughness=.25}
    P._base=P.bodyMat.color.clone();P._baseL=P.lidMat.color.clone();P._em=P.bodyMat.emissive.clone();P._emI=P.bodyMat.emissiveIntensity}
  finally{B3OPT=prev}}
function g3Tint(P,hex,k){if(!P._base)return;const c=new P.T.Color(hex);P.bodyMat.color.copy(P._base).lerp(c,k);P.lidMat.color.copy(P._baseL).lerp(c,k)}
function g3Reset(P){P.g.visible=true;P.g.position.set(0,0,0);P.g.rotation.set(.05,0,0);P.g.scale.set(1,1,1);if(P._base){P.bodyMat.color.copy(P._base);P.lidMat.color.copy(P._baseL);P.bodyMat.emissive.copy(P._em);P.bodyMat.emissiveIntensity=P._emI}
  if(P.spirals)P.spirals.forEach(d=>d.visible=false);for(const n in P.mouths)P.mouths[n].scale.set(1,1,1);setFace3(P,0);persFace(P,0)}

function g3DrawFx(fx,fy,k,dt){const c=ctx;c.save();
  for(let i=G3.fx.length-1;i>=0;i--){const f=G3.fx[i];f.life-=dt;if(f.life<=0||f.y<-6){G3.fx.splice(i,1);continue}
    f.vy+=f.grav*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;const x=fx+f.x*k,y=fy-f.y*k,r=f.sz*k;c.globalAlpha=Math.min(1,f.life*2.2);
    if(f.kind==='heart'){c.fillStyle=f.c;c.strokeStyle=INK;c.lineWidth=2;heartPath(c,x,y,r*1.2);c.fill();c.stroke()}
    else if(f.kind==='spark'){c.fillStyle=f.c;c.save();c.translate(x,y);c.rotate(f.rot+=dt*8);starPath(c,0,0,r*1.6,r*.5,4);c.fill();c.restore()}
    else if(f.kind==='smoke'){c.fillStyle=f.c;c.beginPath();c.arc(x,y,r*(1.6-f.life*.5),0,7);c.fill()}
    else{c.fillStyle=f.c;c.beginPath();c.ellipse(x,y,r,r*(f.kind==='puke'?.85:1),0,0,7);c.fill();if(f.kind==='puke'&&r>3){c.globalAlpha*=.35;c.strokeStyle=INK;c.lineWidth=1.5;c.stroke()}}}
  c.restore()}
function g3Bolt(x0,y0,x1,y1,seed){const c=ctx;let s=seed;const R=()=>{s=(s*9301+49297)%233280;return s/233280-.5};
  const pts=[[x0,y0]];for(let i=1;i<9;i++){const u=i/9;pts.push([x0+(x1-x0)*u+R()*S*.9,y0+(y1-y0)*u])}pts.push([x1,y1]);
  c.save();c.lineJoin='round';c.lineCap='round';for(const [w,col] of [[S*.32,'rgba(120,200,255,.35)'],[S*.13,'#9fe6ff'],[S*.05,'#ffffff']]){c.strokeStyle=col;c.lineWidth=w;c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke()}c.restore()}
function g3Draw(gg){if(!G3.r)return false;const dt=Math.min(.05,frameDt||.016),fx=gg.x,fy=sy(gg.wy)+BH/2,k=BH/1.5;
  if(!gg.init)g3Start(gg);g3Pose(gg,dt);

  g3DrawFx(fx,fy,k,dt);
  if(gg.name.startsWith('bones')&&gg.t>.45&&gg.t<.82&&Math.sin(gg.t*80)>-.3)g3Bolt(fx+rnd(-1,1)*S*.2,fy-BH*4.5,fx,fy-BH*.95,Math.floor(gg.t*25));
  if(G3.flash>0){ctx.save();ctx.globalAlpha=G3.flash*.55;ctx.fillStyle='#eaf8ff';ctx.fillRect(0,0,W,H);ctx.restore();G3.flash=Math.max(0,G3.flash-dt*3.5)}

/* ===== v38: daily login gift — 7-day streak calendar, pops up once a day in the lobby ===== */
Object.assign(I18N.en,{dlTitle:'Daily gift',dlDay:'Day {n}',dlClaim:'Collect!',dlSub:'Come back every day — day 7 is a big chest!',dlStreak:'Streak: {n} days',dlBoost:'+ booster',dlBoost2:'+ 2 boosters'});
Object.assign(I18N.he,{dlTitle:'מתנה יומית',dlDay:'יום {n}',dlClaim:'לקחת!',dlSub:'חוזרים כל יום, וביום 7 מחכה תיבה גדולה!',dlStreak:'רצף: {n} ימים',dlBoost:'+ בוסטר',dlBoost2:'+ 2 בוסטרים'});

// coins per streak day; b = boosters added on top
const DL_REWARDS=[{c:50},{c:80},{c:100,b:1},{c:120},{c:150,b:1},{c:200},{c:400,b:2}];
function dlDate(off){const d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function dlState(){const L=progress.login||{last:null,streak:0},td=dlDate(0);
  if(L.last===td)return {claimed:true,day:L.streak};
  return {claimed:false,day:L.last===dlDate(-1)?L.streak%7+1:1}}
function dlClaim(){const s=dlState();if(s.claimed)return;const R=DL_REWARDS[s.day-1];
  progress.login={last:dlDate(0),streak:s.day};progress.coins=(progress.coins||0)+R.c;
  if(R.b){const inv=wallet().inv;for(let i=0;i<R.b;i++){const b=pick(['slow','laser','shield','heart']);inv[b]=(inv[b]||0)+1}}
  saveProgress();sfx.coin(4);if(s.day===7)sfx.flourish(3);coinShower(R.c);updateWalletUI()}
function openDailyGift(){showOverlay(()=>{const s0=dlState();return {title:t('dlTitle'),extra:card=>{
  const s=dlState(),g=document.createElement('div');g.className='dl-grid';
  DL_REWARDS.forEach((R,i)=>{const d=i+1,got=d<s.day||(s.claimed&&d===s.day),now=!s.claimed&&d===s.day,el=document.createElement('div');
    el.className='dl-day'+(d===7?' big':'')+(got?' got':'')+(now?' now':'');
    el.innerHTML=`<small></small><img src="art/${d===7?'ic_chest':R.b?'ic_gift':'ic_coin'}.webp" alt=""><b>${R.c}</b>`+(R.b?'<i></i>':'')+(got?'<em>✓</em>':'');
    el.querySelector('small').textContent=t('dlDay',{n:d});if(R.b)el.querySelector('i').textContent=t(R.b>1?'dlBoost2':'dlBoost');g.appendChild(el)});
  card.appendChild(g);const p=document.createElement('p');p.className='dl-sub';p.textContent=s.day>1?t('dlStreak',{n:s.claimed?s.day:s.day-1})+' · '+t('dlSub'):t('dlSub');card.appendChild(p)},
  actions:s0.claimed?[{label:t('close'),primary:true,fn:hideOverlay}]:[{label:t('dlClaim'),primary:true,fn:()=>{dlClaim();rerenderOverlay();setTimeout(()=>{if(document.querySelector('.dl-grid'))hideOverlay()},1300)}}]}},true)}
// show it by itself once per day, the first time the lobby is idle (not on the very first launch, before any level)
let dlShownOn=null;
function dlMaybe(){const td=dlDate(0);if(dlShownOn===td||dlState().claimed||progress.unlocked<2)return;
  setTimeout(()=>{if(dlShownOn===td||state!=='title'||W3.on||!document.getElementById('overlay').hidden||document.getElementById('title').hidden)return;dlShownOn=td;openDailyGift()},700)}
{const _ul=updateLobby;updateLobby=function(){_ul();dlMaybe()}}
dlMaybe();   // modules load after the boot toTitle(), so check once now too

requestAnimationFrame(t0=>{last=t0;requestAnimationFrame(frame)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(state==='title')drawTitleArt()});
